<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companies — Mukuba Hub</title><link rel="stylesheet" href="css/style.css"></head><body>
<main id="m"></main>
<script src="config.js"></script>
<script type="module">
import {sb,layout,configBanner,esc,msg,publicUrl,$} from "./js/app.js";
await layout("companies.html");
$("#m").innerHTML=`${configBanner()}<h1>Verified Companies</h1><p>Only organisations verified by the administration appear here. <a href="login.html?mode=company">Register your company</a>.</p><div id="msg"></div><div id="list" class="grid"></div>`;
if(sb){const{data,error}=await sb.from("companies").select("id,name,industry,description,website,address,logo_path").eq("status","approved").order("name");
if(error)msg($("#msg"),error.message);else $("#list").innerHTML=!data.length?'<div class="empty" style="grid-column:1/-1">No verified companies yet. Be the first to discover new opportunities when they become available.</div>':
data.map(c=>`<div class="card">${c.logo_path?`<img src="${publicUrl("company-logos",c.logo_path)}" alt="" style="height:54px;object-fit:contain">`:""}<h3>${esc(c.name)}</h3><span class="chip">${esc(c.industry)}</span><p>${esc(c.description.slice(0,180))}</p><small>📍 ${esc(c.address)}</small>${/^https?:\/\//.test(c.website||"")?`<p><a href="${esc(c.website)}" target="_blank" rel="noopener">Website</a></p>`:""}</div>`).join("");}
</script></body></html>
