<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobs — Mukuba Hub</title><link rel="stylesheet" href="css/style.css"></head><body>
<main id="m"></main>
<script src="config.js"></script>
<script type="module">
import {sb,layout,configBanner,esc,msg,friendly,fmtDate,label,DAYS,TYPES,$,$$} from "./js/app.js";
const me=await layout("jobs.html");
$("#m").innerHTML=`${configBanner()}<h1>Jobs & Opportunities</h1>
<div class="card"><div class="row">
<div><label>Search (title, company, industry)</label><input id="q"></div>
<div><label>Location</label><input id="loc"></div>
<div><label>Type</label><select id="ty"><option value="">All</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
<div><label>Weekend work</label><select id="wk"><option value="">Any</option><option value="1">Includes Sat/Sun</option></select></div></div>
<details style="margin-top:12px"><summary><b>⏱ Find Jobs That Fit My Timetable</b></summary>
<p>Select the days and hours you are free. Only jobs fully inside your availability are shown.</p>
<div class="days" id="days">${DAYS.map(([k,n])=>`<label><input type="checkbox" value="${k}"> ${n}</label>`).join("")}</div>
<div class="row"><div><label>Free from</label><input type="time" id="from"></div><div><label>Free until</label><input type="time" id="to"></div></div>
<p><button class="btn sm" id="fit">Match my timetable</button> <button class="btn sm ghost" id="clr">Clear</button></p></details>
<p><button class="btn" id="go">Search</button></p></div><div id="msg"></div><div id="list" class="grid" style="margin-top:16px"></div>`;
let all=[],fit=null;
async function load(){
 if(!sb)return;
 const{data,error}=await sb.from("jobs").select("*,companies(name,industry,logo_path)").eq("status","published").gte("deadline",new Date().toISOString().slice(0,10)).order("created_at",{ascending:false});
 if(error)return msg($("#msg"),"Could not load jobs: "+friendly(error));
 all=data;show();}
function show(){
 const q=$("#q").value.toLowerCase(),loc=$("#loc").value.toLowerCase(),ty=$("#ty").value,wk=$("#wk").value;
 let r=all.filter(j=>(!q||[j.title,j.companies?.name,j.companies?.industry].join(" ").toLowerCase().includes(q))&&(!loc||j.location.toLowerCase().includes(loc))&&(!ty||j.employment_type===ty)&&(!wk||j.working_days.some(d=>d==="sat"||d==="sun")));
 if(fit)r=r.filter(j=>j.employment_type==="remote"&&!j.working_days.length||(j.working_days.length&&j.working_days.every(d=>fit.days.includes(d))&&(!fit.from||!j.start_hour||j.start_hour.slice(0,5)>=fit.from)&&(!fit.to||!j.end_hour||j.end_hour.slice(0,5)<=fit.to)));
 $("#list").innerHTML=!r.length?`<div class="empty" style="grid-column:1/-1">${all.length?"No jobs match your filters.":"No opportunities available at the moment. Please check again soon."}</div>`:
 r.map(j=>`<div class="card"><span class="chip gold">${TYPES[j.employment_type]}</span><h3>${esc(j.title)}</h3><b>${esc(j.companies?.name)}</b><p>📍 ${esc(j.location)}</p>
 <div class="chips">${j.working_days.map(d=>`<span class="chip">${d.toUpperCase()}</span>`).join("")}<span class="chip">${esc(j.working_hours)}</span></div>
 <p><small>Deadline ${j.deadline} · ${j.positions} position(s)${j.salary?" · "+esc(j.salary):""}</small></p><button class="btn sm" data-id="${j.id}">View & apply</button></div>`).join("");
 $$("#list button").forEach(b=>b.onclick=()=>detail(all.find(j=>j.id===b.dataset.id)));}
function detail(j){
 const bg=document.createElement("div");bg.className="modal-bg";
 bg.innerHTML=`<div class="modal"><h2>${esc(j.title)}</h2><p><b>${esc(j.companies?.name)}</b> · ${esc(j.location)} · ${TYPES[j.employment_type]}</p>
 <h3>Description</h3><p>${esc(j.description).replace(/\n/g,"<br>")}</p><h3>Requirements</h3><p>${esc(j.requirements).replace(/\n/g,"<br>")}</p>
 <h3>Qualifications</h3><p>${esc(j.qualifications).replace(/\n/g,"<br>")}</p><p><b>Days:</b> ${j.working_days.map(d=>d.toUpperCase()).join(", ")||"Flexible"} · <b>Hours:</b> ${esc(j.working_hours)}<br><b>Pay:</b> ${esc(j.salary||"Not stated")}<br><b>Deadline:</b> ${j.deadline}</p>
 <h3>How to apply</h3><p>${esc(j.instructions)}</p><div id="am"></div>
 ${me?.role==="student"?`<label>Short note to employer (optional)</label><textarea id="note"></textarea><p><button class="btn" id="ap">Apply now</button> `:`<p>${me?"Only student accounts can apply.":'<a class="btn" href="login.html">Log in to apply</a> '}`}<button class="btn ghost" id="cl">Close</button></p></div>`;
 document.body.appendChild(bg);$("#cl",bg).onclick=()=>bg.remove();
 const ap=$("#ap",bg);if(ap)ap.onclick=async()=>{ap.disabled=true;
  const{error}=await sb.from("job_applications").insert({job_id:j.id,student_id:me.id,cover_note:$("#note",bg).value||null});
  msg($("#am",bg),error?(error.code==="23505"?"You have already applied for this job.":friendly(error)):"Application submitted. Track it in your dashboard.",error?"err":"ok");if(error)ap.disabled=false;};}
$("#go").onclick=show;
$("#fit").onclick=()=>{fit={days:$$("#days input:checked").map(i=>i.value),from:$("#from").value,to:$("#to").value};if(!fit.days.length){fit=null;msg($("#msg"),"Select at least one available day.");return}msg($("#msg"),"Showing jobs that fit your timetable.","info");show();};
$("#clr").onclick=()=>{fit=null;$$("#days input").forEach(i=>i.checked=false);msg($("#msg"),"");show();};
load();
</script></body></html>
